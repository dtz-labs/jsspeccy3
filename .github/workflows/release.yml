name: release

# Attaches a ready-to-serve build to a release, so another site can vendor a
# known version of the emulator instead of building this repository itself.
#
# Tag a commit to publish one:
#   git tag -a v3.2.0-timex.1 -m "Timex build" && git push origin v3.2.0-timex.1

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and attach dist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release build
        run: npm run build:release

      - name: Check the Timex machines made it into the bundle
        run: |
          set -eu
          test -f dist/jsspeccy/tapeloaders/tape_2048.szx
          test -f dist/jsspeccy/tapeloaders/tape_2068.szx
          test -f dist/jsspeccy/roms/2068-home.rom
          test -f dist/jsspeccy/roms/2068-exrom.rom

      - name: Package
        run: |
          set -eu
          mkdir -p artifacts
          (cd dist && zip -qr ../artifacts/jsspeccy-dist.zip .)
          (cd dist && tar -czf ../artifacts/jsspeccy-dist.tar.gz .)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/jsspeccy-dist.zip
            artifacts/jsspeccy-dist.tar.gz
          generate_release_notes: true
